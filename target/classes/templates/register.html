<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register - Hotel Booking</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="auth-page">
<div class="auth-card">
    <h1>🏨 Hotel Booking</h1>
    <h2>Register</h2>

    <p class="error" th:if="${error}" th:text="${error}"></p>

    <form method="post" th:action="@{/register}" th:object="${user}">
        <label for="username">Username</label>
        <input type="text" id="username" th:field="*{username}" autofocus>
        <span class="field-error" th:errors="*{username}"></span>

        <label for="email">Email</label>
        <input type="email" id="email" th:field="*{email}">
        <span class="field-error" th:errors="*{email}"></span>

        <label for="password">Password</label>
        <input type="password" id="password" th:field="*{password}">
        <span class="field-error" th:errors="*{password}"></span>

        <button type="submit" class="btn-primary">Register</button>
    </form>

    <p class="switch-link">Already have an account? <a th:href="@{/login}">Login here</a></p>
</div>
</body>
</html>
